<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset=".35" stop-color="#5b1a6e"/>
      <stop offset=".58" stop-color="#e2366f"/>
      <stop offset=".72" stop-color="#ff8a3d"/>
      <stop offset=".78" stop-color="#ffc56b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset=".25" stop-color="#b8327a"/>
      <stop offset="1" stop-color="#160a33"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset=".6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e78"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff5e78" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="780" fill="url(#sky)"/>
